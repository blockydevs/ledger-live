services:
  rippled:
    image: xrplf/xrpld:3.4.1@sha256:457f095d1948a354119187df962b60504a4791521f8225a28ba2345c34a6b0ce
    container_name: coin-tester-xrp
    # The image's entrypoint is the xrpld binary itself and its default
    # command joins the public network, so `command` must name the config
    # and the standalone-mode flags.
    command:
      - --standalone
      - --start
      - --conf
      - /etc/xrpld/xrpld.cfg
    volumes:
      - ./rippled.cfg:/etc/xrpld/xrpld.cfg:ro
    ports:
      - "5005:5005"
      - "6006:6006"
    # The image ships no curl/wget, so the healthcheck uses the xrpld CLI
    # itself. The grep enforces a ready `server_state` (not just RPC up),
    # so by the time `docker compose up --wait` returns rippled is fully
    # primed and no additional in-code readiness loop is needed.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "xrpld --conf /etc/xrpld/xrpld.cfg server_info 2>/dev/null | grep -qE '\"server_state\" : \"(full|proposing|validating)\"'",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
