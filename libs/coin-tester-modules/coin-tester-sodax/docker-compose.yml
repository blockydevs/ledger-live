services:
  goloop:
    platform: linux/amd64
    image: coin-tester-goloop:latest
    build:
      context: .
      dockerfile: goloop.Dockerfile
    # src/goloop.ts sets these on the compose env before `up`. `:-` keeps
    # `compose down` quiet when they are absent; the entrypoint's `:?` guard
    # still enforces presence at container runtime.
    environment:
      - GOD_ADDRESS=${GOD_ADDRESS:-}
      - GENESIS_BALANCE=${GENESIS_BALANCE:-}
      - GOD_KEYSTORE_JSON=${GOD_KEYSTORE_JSON:-}
    ports:
      - "9080:9080"
    healthcheck:
      # A successful governance deploy submission does not prove execution.
      # getStepPrice only answers once the deploy's on_install has run, so it
      # covers both the chain's height and the governance install in one call.
      test:
        [
          "CMD-SHELL",
          "curl -sf -X POST http://127.0.0.1:9080/api/v3 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"icx_call\",\"params\":{\"to\":\"cx0000000000000000000000000000000000000001\",\"dataType\":\"call\",\"data\":{\"method\":\"getStepPrice\"}}}' | jq -e '.result != null and .result != \"\"' >/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

# No named volume: the single node keeps its state in the container filesystem,
# and `down --volumes` discards it, so each run starts from a fresh genesis.
